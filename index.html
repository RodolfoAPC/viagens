<!doctype html><html lang="pt-BR"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4B2D73"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Viagens"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nossas Viagens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: app de uma coluna, touch-first — busca fixa no topo, conteúdo em "etiquetas de preço", navegação inferior com 4 abas */
:root{
  --bg:#F2F1F6; --surface:#FFFFFF; --surface-2:#E9E7F0; --ink:#1D1A2B; --muted:#5E5970; --line:#D6D2E2;
  --oud:#9A5A00; --oud-soft:#F6E7CF; --plum:#4B2D73; --plum-soft:#ECE4F7;
  --ok:#1F7A4D; --ok-soft:#DDF1E6; --warn:#9A5A00; --bad:#B3261E; --bad-soft:#F9DEDC;
  --shadow:0 1px 2px rgba(29,26,43,.06),0 6px 18px rgba(29,26,43,.06);
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; --tap:48px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14121C; --surface:#1E1B29; --surface-2:#292537; --ink:#EEEBF6; --muted:#A9A3BC; --line:#363149;
  --oud:#E9A642; --oud-soft:#3A2B14; --plum:#C7AEF0; --plum-soft:#2E2445;
  --ok:#6FD3A0; --ok-soft:#173527; --warn:#E9A642; --bad:#F2A49E; --bad-soft:#3E1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14121C; --surface:#1E1B29; --surface-2:#292537; --ink:#EEEBF6; --muted:#A9A3BC; --line:#363149;
  --oud:#E9A642; --oud-soft:#3A2B14; --plum:#C7AEF0; --plum-soft:#2E2445;
  --ok:#6FD3A0; --ok-soft:#173527; --warn:#E9A642; --bad:#F2A49E; --bad-soft:#3E1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
a{color:var(--plum)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--oud);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font:700 1.4rem/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.brand h1 i{font-style:italic;font-weight:500;color:var(--oud)}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:4px 10px;min-height:28px}
.mode b{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.mode.live b{background:var(--ok)}
form.busca{display:flex;gap:8px;margin-top:8px}
.campo{flex:1;min-width:0;position:relative}
.campo input{width:100%;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 44px 0 14px;font-size:1.05rem}
.campo input:focus{border-color:var(--plum);outline:none;box-shadow:0 0 0 3px var(--plum-soft)}
.limpar{position:absolute;right:2px;top:2px;width:48px;height:48px;border:0;background:none;color:var(--muted);font-size:1.3rem;border-radius:10px;cursor:pointer}
.btn{min-height:var(--tap);border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--plum);border-color:var(--plum);color:var(--surface)}
.btn.sm{min-height:44px;padding:0 12px;font-size:.92rem}
.btn:disabled{opacity:.55;cursor:default}
.btn.go{height:52px}
.sugest{position:absolute;left:0;right:0;top:56px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:6;max-height:50vh;overflow:auto}
.sugest button{display:flex;width:100%;text-align:left;min-height:var(--tap);border:0;background:none;padding:8px 14px;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid var(--line)}
.sugest button:last-child{border-bottom:0}
.sugest button:hover,.sugest button.on{background:var(--plum-soft)}
.sugest small{color:var(--muted);margin-left:auto;font-size:.78rem;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px;cursor:pointer;font-size:.92rem;white-space:nowrap}
main section{margin-top:18px}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 8px}
h2{font:700 1.45rem/1.15 var(--f-display);margin:0;text-wrap:balance}
h3{font:700 1.08rem/1.25 var(--f-body);margin:0;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.hero{display:grid;gap:10px}
.marca{color:var(--muted);font-size:.9rem}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;flex:0 0 auto}
.tag.alta{background:var(--ok-soft);color:var(--ok)}
.tag.media{background:var(--oud-soft);color:var(--oud)}
.tag.claude{background:var(--plum-soft);color:var(--plum)}
.tag.exemplo{background:var(--surface-2);color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.preco{font:600 1.35rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.preco small{font:500 .82rem var(--f-mono);color:var(--muted);margin-left:6px}
.status{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.92rem;min-height:28px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--plum);animation:g 0.9s linear infinite;flex:0 0 auto}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.ofertas{list-style:none;margin:0;padding:0;display:grid;gap:0}
.of{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px dashed var(--line);align-items:center}
.of:first-child{border-top:0}
.of .loja{font-weight:700;min-width:0}
.of .loja small{display:block;font-weight:400;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.of .acoes{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.of.melhor .loja::before{content:"Menor preço";display:inline-block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;background:var(--ok-soft);color:var(--ok);border-radius:6px;padding:1px 6px;margin-right:8px;vertical-align:2px}
.dupes{display:grid;gap:12px}
.dupe{display:grid;gap:8px}
.dupe .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dupe .top>div{min-width:0}
.nota{color:var(--muted);font-size:.9rem;margin:0}.insp{display:grid;gap:8px;justify-items:start}.eco{display:inline-block;background:var(--ok-soft);color:var(--ok);font-weight:700;border-radius:8px;padding:2px 8px;font-size:.85rem;margin-left:6px}
.atalhos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.atalhos .btn{text-align:center;padding:6px 10px;line-height:1.2}.atalhos .btn:first-child{grid-column:1/-1}
.aviso{background:var(--oud-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.92rem}
.aviso.bad{background:var(--bad-soft)}
.vazio{text-align:center;color:var(--muted);padding:28px 8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:720px}
nav.tabs button{min-height:60px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.8rem;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--plum);font-weight:700}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--oud);color:var(--surface);font-size:.7rem;border-radius:999px;min-width:18px;height:18px;line-height:18px;padding:0 5px;font-weight:700}
.cota{display:grid;gap:8px}
.barra{height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.barra i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.barra.over i{background:var(--bad)}.barra.quase i{background:var(--oud)}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .nm{min-width:0;font-weight:700}
.item .nm small{display:block;font-weight:400;color:var(--muted)}
.qtd{display:flex;align-items:center;gap:4px}
.qtd button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:1.2rem;cursor:pointer}
.qtd span{min-width:26px;text-align:center;font:600 1rem var(--f-mono)}
.usdin{width:110px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font:500 1rem var(--f-mono);text-align:right}
.lojas{display:grid;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;margin-top:12px}
.seg button{min-height:44px;border:0;border-radius:9px;background:none;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--plum);box-shadow:var(--shadow)}
.clt{font:700 1.2rem/1.2 var(--f-display)}
.ficha{border-top:1px solid var(--line);padding-top:8px}
.ficha summary{min-height:48px;display:flex;align-items:center;font-weight:700;color:var(--plum);cursor:pointer;list-style:none;gap:8px}
.ficha summary::-webkit-details-marker{display:none}
.ficha summary::before{content:"▸";transition:transform .2s}
.ficha[open] summary::before{transform:rotate(90deg)}
.fbody{display:grid;gap:10px}
.fbody p{margin:0}
.fbody h4{font:700 1rem/1.3 var(--f-display);margin:8px 0 0}
.kv{display:grid;grid-template-columns:1fr;gap:2px 12px;margin:0}.kv dd+dt{margin-top:6px}@media (min-width:480px){.kv{grid-template-columns:130px 1fr;gap:6px 12px}.kv dd+dt{margin-top:0}}
.kv dt{font-weight:700;font-size:.88rem}.kv dd{margin:0;color:var(--muted);font-size:.92rem;min-width:0}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cmpl{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.cmpl span{font-size:.8rem;color:var(--muted)}.cmpl b{font:600 1.15rem var(--f-mono)}.cmpl small{font-size:.8rem;color:var(--muted)}
.cmpl.best{background:var(--ok-soft)}.cmpl.best small,.cmpl.best span{color:var(--ok)}
.tab{list-style:none;margin:0;padding:0}
.tab li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px dashed var(--line);align-items:baseline}
.tab li:first-child{border-top:0}
.tab li span{min-width:0}.tab li small{color:var(--muted);font-size:.82rem}
.tab li b{font:600 .95rem var(--f-mono);white-space:nowrap}
.tab li.col{flex-direction:column;gap:2px}
.eqv{background:var(--ok-soft);border-radius:12px;padding:12px;display:grid;gap:8px}
.eqv .nota{color:var(--ink);opacity:.8}
.acoes2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.acoes2 .btn:first-child{grid-column:1/-1}
.loja-c{display:grid;gap:6px}
.loja-c .cid{font-size:.82rem;color:var(--muted)}
.config{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.config label{font-weight:700}
.config input{width:110px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 10px;font:500 1.05rem var(--f-mono);text-align:right}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:9;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.foot{color:var(--muted);font-size:.82rem;margin-top:22px}
@media (min-width:560px){.brand h1{font-size:2rem}}
@media (orientation:landscape) and (max-height:500px){header.top{position:static}}
</style>

<style>
/* ===== Shell "Nossas Viagens": módulos Viagens / Salas VIP / Perfumes ===== */
.mod[hidden]{display:none!important}
nav.appnav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.appnav .in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:720px}
nav.appnav button{min-height:62px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.8rem;color:var(--muted);cursor:pointer}
nav.appnav button svg{width:24px;height:24px}
nav.appnav button[aria-selected="true"]{color:var(--plum);font-weight:700}
/* sub-abas do módulo Perfumes (antiga barra inferior) */
#modPerf header.top nav.tabs{position:static;border:0;background:none;padding:0;margin-top:8px;display:block}
#modPerf header.top nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:none}
#modPerf header.top nav.tabs button{min-height:40px;flex-direction:row;gap:6px;font-size:.84rem;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
#modPerf header.top nav.tabs button svg{width:18px;height:18px}
#modPerf header.top nav.tabs button[aria-selected="true"]{background:var(--plum-soft);border-color:var(--plum)}
#modPerf header.top nav.tabs .badge{position:static;margin-left:2px}
/* cabeçalho dos módulos novos */
.nv-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.nv-head h1{font:700 1.5rem/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.nv-head .sub{color:var(--muted);font-size:.86rem;margin-top:2px}
.nv-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nv-sp{flex:1}
.nv-note{font-size:.86rem;color:var(--muted)}
.nv-aviso{background:var(--oud-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.9rem}
/* cartão de embarque (próxima viagem) */
.pass{display:grid;grid-template-columns:1fr auto;background:var(--plum);color:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;border:0;width:100%;text-align:left;padding:0;font:inherit}
.pass .main{padding:18px 18px 16px;min-width:0}
.pass .stub{padding:18px 16px;border-left:2px dashed rgba(255,255,255,.45);display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:96px;position:relative}
.pass .stub::before,.pass .stub::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.pass .stub::before{top:-10px}.pass .stub::after{bottom:-10px}
.pass .rota{font:700 2.6rem/1 var(--f-display);letter-spacing:.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pass .rota svg{width:28px;height:28px;flex:0 0 auto;opacity:.85}
.pass .dest{font:500 1.05rem/1.3 var(--f-body);margin-top:6px;opacity:.95}
.pass .datas{font-size:.88rem;opacity:.85;margin-top:10px}
.pass .n{font:700 2.4rem/1 var(--f-display)}
.pass .l{font-size:.78rem;opacity:.85;text-align:center}
.pass.jeri .rota{font-size:2rem}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pass{background:#3A2560}}
:root[data-theme="dark"] .pass{background:#3A2560}
.trip{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit}
.trip .dt{font:700 1.05rem/1 var(--f-display);min-width:58px;color:var(--oud)}
.trip .t{font-weight:700}
.trip small{display:block;color:var(--muted)}
.nv-list{display:grid;gap:8px}
/* detalhe */
.det h2{margin-bottom:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:500}
.tbl td:first-child,.tbl td:nth-child(3),.tbl td:nth-child(4){white-space:nowrap}
.dia{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dia b{color:var(--plum)}
.pend{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.pend input{width:22px;height:22px;margin-top:2px;accent-color:var(--plum);flex:0 0 auto}
.pend.ok span{text-decoration:line-through;color:var(--muted)}
.nv-sec{margin-top:18px}
.nv-sec>h3{margin-bottom:8px}
.form-v label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 4px}
.form-v label small{font-weight:400;color:var(--muted)}
.form-v input,.form-v textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:1rem}
.form-v textarea{min-height:88px;resize:vertical;font-size:.95rem}
.form-v .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* salas VIP */
.vip-busca{display:flex;gap:8px;margin-top:10px}
.vip-busca input{flex:1;min-width:0;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:1rem}
.vip-busca input:focus{border-color:var(--plum);outline:none;box-shadow:0 0 0 3px var(--plum-soft)}
.vseg{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.vseg::-webkit-scrollbar{display:none}
.vseg button{flex:0 0 auto;min-height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:.88rem;cursor:pointer}
.vseg button[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--surface)}
.mapa{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;margin-top:14px}
.mapa svg{width:100%;height:auto;display:block;max-height:52vh}

const IDX = [];
BASE.forEach((o,i)=>{
  IDX.push({tipo:"o",i,nome:o[0],marca:o[1],chave:norm(o[1]+" "+o[0]),curta:norm(o[0]),alias:o[3].map(norm)});
  o[4].forEach((d,j)=>IDX.push({tipo:"d",i,j,nome:d[0],marca:d[1],chave:norm(d[1]+" "+d[0]),curta:norm(d[0]),alias:[]}));
});
function pontua(e,qn){
  if(!qn) return 0;
  const toks=qn.split(" ").filter(Boolean);
  if(e.curta===qn||e.chave===qn||e.alias.includes(qn)) return 100;
  let s=0;
  if(e.chave.startsWith(qn)||e.curta.startsWith(qn)) s=80;
  else if(e.alias.some(a=>a.startsWith(qn))) s=75;
  else if((" "+e.chave+" ").includes(" "+qn)) s=65;
  else { const hit=toks.filter(t=>e.chave.includes(t)||e.alias.some(a=>a.includes(t))).length; if(hit===toks.length) s=45+hit; else if(hit && toks.length>1) s=15*hit; }
  return s - e.chave.length/100;
}
function procura(q,lim=8){
  const qn=norm(q); if(!qn) return [];
  return IDX.map(e=>({e,s:pontua(e,qn)})).filter(x=>x.s>12).sort((a,b)=>b.s-a.s).slice(0,lim);
}

const espera = ms => new Promise(r=>setTimeout(r,ms));
function textoDe(res){ if(!res) return ""; if(typeof res.payload==="string") return res.payload; const b=(res.content||[]).filter(c=>c.type==="text").map(c=>c.text); return b.join("\n"); }
async function host(tool,input,signal){ return S.mcp.callTool(HOST,tool,input,{signal,cache:false}); }
let FILA=Promise.resolve();
function abre(url,signal){ const p=FILA.then(()=>abre0(url,signal)); FILA=p.catch(()=>{}); return p; }
async function abre0(url,signal){
  if(signal?.aborted) throw {code:"cancelled"};
  const u = url.replace("://www.comprasparaguai","://mobile.comprasparaguai");
  if(!S.tab){
    const r = await host("preview_start",{url:u},signal);
    const m = textoDe(r).match(/tabId\s+([^\s)]+)\)?/); S.tab = m ? m[1] : null;
  } else {
    try{ await host("navigate",{url:u,tabId:S.tab},signal); }
    catch(e){ if(e?.code==="tool_error"){ S.tab=null; return abre0(url,signal);} throw e; }
  }
  await espera(900);
  let txt="";
  for(let k=0;k<3;k++){
    try{ txt = textoDe(await host("read_page",{filter:"all",max_chars:250000,depth:40,...(S.tab?{tabId:S.tab}:{})},signal)); }
    catch(e){ if(e?.code==="cancelled") throw e; txt=""; }
    if(/US\$\s?[\d.,]+/.test(txt)) break;
    await espera(1500);
  }
  return txt;
}
/* Lê a árvore de acessibilidade do Compras Paraguai (testado em 01/10/2026). */
function parseCP(txt){
  const L = String(txt||"").split("\n"); const grupos=[], ofertas=[]; let cur=null, cot=null;
  const fecha=()=>{ if(cur){ if(cur.tipo==="g"&&cur.usd) grupos.push(cur); if(cur.tipo==="o"&&cur.usd&&cur.loja) ofertas.push(cur);} cur=null; };
  for(let i=0;i<L.length;i++){
    const s=L[i]; let m;
    if(/generic "Dólar hoje:"/.test(s)){ const n=(L[i+1]||"").match(/R\$ ([\d.,]+)/); if(n) cot=parseNum(n[1]); continue; }
    if((m=s.match(/link "([^"]+)" \[ref_\d+\] href="(\/[a-z0-9-]+_\d+\/)"/))){ fecha(); cur={tipo:"g",nome:m[1],url:"https://www.comprasparaguai.com.br"+m[2]}; continue; }
    if((m=s.match(/link "([^"]+)" \[ref_\d+\] href="(\/[a-z0-9-]+__\d+\/)"/))){ fecha(); cur={tipo:"o",nome:m[1],url:"https://www.comprasparaguai.com.br"+m[2],cidade:"Ciudad del Este"}; continue; }
    if(!cur) continue;
    if((m=s.match(/generic "US\$ ([\d.,]+)"/)) && !cur.usd){ cur.usd=parseNum(m[1]); continue; }
    if((m=s.match(/button "(\d+) OFERTAS"/i))){ cur.ofertas=+m[1]; continue; }
    if(cur.tipo!=="o") continue;
    if((m=s.match(/href="https:\/\/api\.whatsapp\.com\/send\?phone=(\d+)/))){ cur.whats=m[1]; continue; }
    if((m=s.match(/generic "([^"]+)"/)) && CIDADES.includes(m[1])){ cur.cidade=m[1]; continue; }
    if((m=s.match(/href="\/lojas\/([a-z0-9-]+)\/"/))){ cur.slug=m[1]; const im=(L[i+1]||"").match(/image "([^"]+)"/); cur.loja=im?im[1]:m[1].replace(/-/g," "); fecha(); continue; }
    if((m=s.match(/href="(https?:\/\/[^"]+)"/)) && !cur.site && !/whatsapp|comprasparaguai|bit\.ly|linktr\.ee|javascript/.test(m[1])){ cur.site=m[1]; continue; }
  }
  fecha();
  return {grupos,ofertas,cot};
}
const RUIDO = /\b(kit|body|creme|cream|desodor|deo|ambientador|hair|mist|miniatura|sabonete|locao|loção|shower|gel|tester|refil|decant|amostra|oleo|óleo|5ml|10ml|25ml)\b/i;
function melhorGrupo(grupos,q){
  const toks=norm(q).split(" ").filter(t=>t.length>1);
  let best=null,bs=-1;
  for(const g of grupos){
    if(RUIDO.test(g.nome)) continue;
    const n=norm(g.nome); let s=toks.filter(t=>(" "+n+" ").includes(" "+t+" ")).length*10;
    if(s<toks.length*10*0.6) continue;
    const extras=n.split(" ").filter(w=>!toks.includes(w)&&!["perfume","eau","de","parfum","toilette","masculino","feminino","unissex","edp","edt","ml","100ml","intense"].includes(w)&&!/^\d+ml$/.test(w)).length;
    s-=extras*3; const vol=(norm(q).match(/\b(\d+)ml\b/)||[])[1]; if(vol){ if(n.includes(vol+"ml")) s+=8; } else if(/100ml/i.test(g.nome)) s+=4; s+=Math.min(g.ofertas||0,40)/10;
    if(s>bs){bs=s;best=g;}
  }
  return best;
}
async function precoAoVivo(q,signal,mq){
  const txt = await abre(urlCP(q),signal);
  const r = parseCP(txt);
  if(r.cot && r.cot>3 && r.cot<10){ S.cot=r.cot; S.cotFonte="Compras Paraguai, hoje"; ls.set("cot",S.cot); ls.set("cotFonte",S.cotFonte); }
  const g = melhorGrupo(r.grupos,mq||q);
  return {g, avulsos:r.ofertas.filter(o=>!RUIDO.test(o.nome)), lido: txt.length>500};
}
async function ofertasAoVivo(g,signal){
  const txt = await abre(g.url,signal);
  const r = parseCP(txt);
  const vistas=new Set();
  return r.ofertas.filter(o=>!RUIDO.test(o.nome)).sort((a,b)=>a.usd-b.usd).filter(o=>{const k=o.slug||o.loja; if(vistas.has(k)) return false; vistas.add(k); return true;});
}

async function perguntaClaude(q,signal){
  if(!S.sample) return null;
  const prompt = `Você é um especialista em perfumaria que conhece bem as lojas do Paraguai (Ciudad del Este, Pedro Juan Caballero).
O usuário digitou: "${q.slice(0,80)}".
1) Identifique o perfume (nome oficial e marca). Se for um perfume árabe/contratipo, diga em qual original ele é inspirado.
2) Liste de 2 a 5 alternativas mais baratas comuns nas lojas do Paraguai (Lattafa, Armaf, Maison Alhambra, Al Haramain, Afnan, Rasasi, French Avenue, Paris Corner, Fragrance World, Orientica, Zimaya) que a comunidade (Fragrantica, blogs de dupes) considera inspiradas nele ou muito parecidas.
Regras: não invente nomes; se não tiver certeza de que um produto existe, não liste. "alta" só quando o par é amplamente citado. Se não reconhecer o perfume, devolva contratipos vazio e explique em observacao.
Responda somente JSON: {"original":{"nome":"","marca":"","genero":"M|F|U"},"e_contratipo":false,"inspirado_em":{"nome":"","marca":""} ou null,"contratipos":[{"nome":"","marca":"","confianca":"alta|media","nota":"até 12 palavras"}],"observacao":""}`;
  try{ return await S.sample.json(prompt,{signal,modelTier:"default",cache:{gcTime:86400000}}); }
  catch(e){ if(e?.code==="not_granted"||e?.code==="sampling_disabled"||e?.code==="not_declared"){ S.sample=null; pintaModo(); } if(e?.code==="cancelled") throw e; return {erro:e?.code||"erro"}; }
}

function resolve(q,sel){
  // sel: entrada do índice escolhida na sugestão
  const hit = sel || procura(q,1)[0]?.e;
  if(!hit) return null;
  const o = BASE[hit.i];
  const orig = {nome:o[0],marca:o[1],gen:o[2]};
  const dupes = o[4].map(d=>({nome:d[0],marca:d[1],conf:d[2],nota:d[3],fonte:"base"}));
  if(hit.tipo==="o") return {principal:{...orig,tipo:"original"},orig,dupes};
  const d = dupes[hit.j];
  return {principal:{nome:d.nome,marca:d.marca,tipo:"contratipo",conf:d.conf,nota:d.nota},orig,dupes:dupes.filter((_,j)=>j!==hit.j)};
}

async function precosDaTela(R,q,signal,run){

      const ofs = r.ofs || await ofertasAoVivo(r.g,signal); r.ofs=ofs;
      if(run!==RUN) return;
      b=box("p_main"); if(b) b.innerHTML = `<div class="row" style="margin-bottom:6px"><span class="preco">${fmtUSD((ofs[0]||r.g).usd)}<small>${brl((ofs[0]||r.g).usd)}</small></span><span class="nota">${esc(r.g.nome)}</span></div>` + ofertasHTML(ofs,qP,r.g);
    }
  }catch(e){ if(e?.code==="cancelled"){ limpaSpins(); return;} trata("p_main",e); if(fatal(e)) return; }
  // preço do original quando a busca foi um contratipo
  if(P?.tipo==="contratipo" && R?.orig?.nome){
    const qo=(R.orig.marca?R.orig.marca+" ":"")+R.orig.nome;
    try{ const r=CACHE.get(norm(qo)) || await precoAoVivo(qo,signal); CACHE.set(norm(qo),r);
      if(run!==RUN) return; const sp=box("p_orig");
      if(sp && r.g){ S.precoOrig=r.g.usd; const meu=CACHE.get(norm(qP)); const m=meu?.ofs?.[0]?.usd||meu?.g?.usd;
        sp.innerHTML=` · original a partir de ${fmtUSD(r.g.usd)}`+(m&&m<r.g.usd?`<span class="eco">economia de ${Math.round((1-m/r.g.usd)*100)}%</span>`:""); }
    }catch(e){ if(e?.code==="cancelled"){ limpaSpins(); return;} }
  } else if(P?.tipo==="original"){ const meu=CACHE.get(norm(qP)); S.precoOrig = meu?.ofs?.[0]?.usd || meu?.g?.usd || null; }
  // contratipos: preço "a partir de" dos 4 primeiros
  const dupes=(R?.dupes||[]).slice(0,4);
  for(let k=0;k<dupes.length;k++){
    if(run!==RUN||signal.aborted) return;
    const d=dupes[k], qd=d.marca+" "+d.nome, id="p_d"+k;
    try{
      let b=box(id); if(b) b.innerHTML=statusHTML("Buscando preço…");
      const r = CACHE.get(norm(qd)) || await precoAoVivo(qd,signal); CACHE.set(norm(qd),r);
      if(run!==RUN) return;
      b=box(id); if(!b) continue;
      b.innerHTML = r.g ? `<div class="row"><span class="preco">${fmtUSD(r.g.usd)}<small>${brl(r.g.usd)}</small></span><span class="nota">a partir de · ${r.g.ofertas||"?"} ofertas</span>${ecoHTML(r.g.usd)}</div>` : `<p class="nota">Sem anúncio no Compras Paraguai agora.</p>`;
      resumoEco();
    }catch(e){ if(e?.code==="cancelled"){ limpaSpins(); return;} trata(id,e); if(fatal(e)) return; }
  }
}
function resumoEco(){
  const el=document.getElementById("resumo"); if(!el||!S.precoOrig||S.R?.principal?.tipo!=="original") return;
  let best=null; (S.R.dupes||[]).forEach(d=>{ const r=CACHE.get(norm(d.marca+" "+d.nome)); const u=r?.ofs?.[0]?.usd||r?.g?.usd; if(u&&(!best||u<best.u)) best={d,u}; });
  if(best && best.u<S.precoOrig) el.innerHTML=`<div class="aviso" style="margin-bottom:12px"><b>Melhor economia:</b> ${esc(best.d.marca+" "+best.d.nome)} a partir de ${fmtUSD(best.u)}, ${Math.round((1-best.u/S.precoOrig)*100)}% abaixo do original (${fmtUSD(S.precoOrig)}).</div>`;
}
function limpaSpins(){ document.querySelectorAll(".precos .status").forEach(s=>s.outerHTML='<p class="nota">Busca interrompida.</p>'); }
const ecoHTML = usd => (S.R?.principal?.tipo==="original" && S.precoOrig && usd < S.precoOrig) ? `<span class="eco">${Math.round((1-usd/S.precoOrig)*100)}% mais barato que o original</span>` : "";
function fatal(e){ return ["not_in_manifest","server_not_connected","not_granted","capability_disabled","blocked_by_policy","cancelled"].includes(e?.code); }
function erroHTML(e,q){
  const c=e?.code;
  let msg = "Não consegui ler as lojas agora.";
  if(c==="server_not_connected"||c==="capability_disabled"||c==="not_granted"){ msg="O navegador do app Claude não está disponível aqui. Use os atalhos."; S.live=false; pintaModo(); }
  else if(c==="not_in_manifest") msg="Você não permitiu o uso do navegador para esta página. Use os atalhos.";
  else if(c==="server_unavailable"||c==="upstream_error") msg="O navegador demorou para responder. Toque em Buscar de novo daqui a pouco.";
  else if(c==="tool_error") msg="O site não abriu no navegador do app.";
  return `<p class="nota">${msg}</p>${q?atalhosHTML(q):""}`;
}
async function abreOfertasDupe(k){
  const card=document.querySelectorAll("#dupes .dupe")[k]; if(!card) return;
  const q=card.dataset.q, id="p_d"+k, b=document.getElementById(id);
  const ctl=new AbortController(); S.ctlD=ctl; const run=RUN;
  card.querySelector('[data-acao="ofertas"]')?.setAttribute("disabled","");
  try{
    b.innerHTML=statusHTML("Lendo lojas… (na fila do navegador)");
    const r = CACHE.get(norm(q)) || await precoAoVivo(q,ctl.signal); CACHE.set(norm(q),r);
    if(!r.g){ b.innerHTML=`<p class="nota">Sem anúncio no Compras Paraguai agora.</p>${atalhosHTML(q)}`; return; }
    const ofs = r.ofs || await ofertasAoVivo(r.g,ctl.signal); r.ofs=ofs;
    if(run!==RUN) return;
    b.innerHTML = (ofs[0]?`<div class="row" style="margin-bottom:4px">${ecoHTML(ofs[0].usd)}</div>`:"") + ofertasHTML(ofs,q,r.g);
    card.querySelector('[data-acao="ofertas"]')?.remove(); resumoEco();
  }catch(e){ card.querySelector('[data-acao="ofertas"]')?.removeAttribute("disabled"); if(e?.code==="cancelled"){ b.innerHTML=""; return;} b.innerHTML=erroHTML(e,q); }
}

document.addEventListener("click",async e=>{

  if(a==="buscar"){ $("#q").value=b.dataset.q; $("#limpar").hidden=false; render(b.dataset.q); }
  else if(a==="lista") addLista(b.dataset.nome, b.dataset.usd?+b.dataset.usd:null, b.dataset.loja||"");
  else if(a==="ofertas") abreOfertasDupe(+b.dataset.k.slice(1));
  else if(a==="mais-of"){ b.closest(".precos").querySelectorAll(".of[hidden]").forEach(li=>li.hidden=false); b.remove(); }
  else if(a==="clGen"){ CL.gen=b.dataset.g; ls.set("clGen",CL.gen); renderClassicos(); }
  else if(a==="clAtualizar") atualizaClassicos();
  else if(a==="irBusca"){ mostra("Buscar"); $("#q").focus(); }
  else if(a==="vivo"){ if(S.ultimo){ const c=S.ctl=new AbortController(); S.exemplo=false; precosDaTela(S.R,S.ultimo.q,c.signal,RUN); } }
  else if(a==="parar"){ S.ctl?.abort(); S.ctlD?.abort(); CL.ctl?.abort(); document.querySelectorAll(".status").forEach(s=>s.outerHTML='<p class="nota">Busca interrompida. Toque em Buscar para tentar de novo.</p>'); }
  else if(a==="copiar"){ const v=b.dataset.v; try{ await navigator.clipboard.writeText(v); toast("Copiado: "+v);}catch(err){ toast(v); } }
  else if(a==="copiarLista"){ const tot=S.lista.reduce((t,x)=>t+(x.usd||0)*x.qtd,0); const txt="Lista de perfumes (Paraguai)\n"+S.lista.map(x=>`• ${x.qtd}x ${x.nome}${x.loja?" ("+x.loja+")":""}${x.usd?" — "+fmtUSD(x.usd*x.qtd):""}`).join("\n")+`\nTotal: ${fmtUSD(tot)} ≈ ${brl(tot)}`; try{ await navigator.clipboard.writeText(txt); toast("Lista copiada. Cole no WhatsApp."); }catch(err){ b.closest("section").querySelector("textarea")?.remove(); const ta=document.createElement("textarea"); ta.value=txt; ta.setAttribute("aria-label","Lista para copiar"); ta.style.cssText="width:100%;height:160px;margin-top:10px"; b.closest("section").append(ta); ta.select(); toast("Selecionei o texto: copie manualmente"); } }

  else if(a==="limparLista"){ if(b.dataset.conf==="1"){ S.lista=[]; salvaLista(); renderLista(); toast("Lista esvaziada"); } else { b.dataset.conf="1"; b.textContent="Toque de novo para confirmar"; setTimeout(()=>{ if(b.isConnected){ b.dataset.conf=""; b.textContent="Esvaziar lista"; } },3000); } }
});

  ["Viagens","Vip","Perf"].forEach(x => { q("#mod"+x).hidden = x!==m; });
  document.querySelectorAll("nav.appnav button").forEach(b => b.setAttribute("aria-selected", b.dataset.mod===m ? "true":"false"));
  ST.mod=m; LS.set("mod",m); window.scrollTo({top:0,behavior:"auto"});
  if(m==="Vip") renderVip();
}
q("nav.appnav").addEventListener("click", e => { const b=e.target.closest("button[data-mod]"); if(b) modulo(b.dataset.mod); });


/* ---------- banco local (versão GitHub Pages) ---------- */
const SEED_VIAGENS = {};
const LocalDB = (() => {
  let docs = LS.get("localdb_viagens", null);
  if(!docs || typeof docs!=="object"){ docs = JSON.parse(JSON.stringify(SEED_VIAGENS)); LS.set("localdb_viagens", docs); }
  const subs = [];
  const snap = () => ({ docs: Object.entries(docs).map(([id,d]) => ({ id, data: () => d })) });
  const emit = () => { const s=snap(); subs.forEach(f => { try{ f(s); }catch(e){} }); };
  const grava = () => { LS.set("localdb_viagens", docs); emit(); };
  return {
    local: true,
    todos: () => docs,
    substitui: novo => { docs = novo; grava(); },
    collection(){ return {
      onSnapshot(cb){ subs.push(cb); setTimeout(() => cb(snap()), 0); return () => {}; },
      doc(id){ return {
        async set(d){ docs[id]=d; grava(); },
        async delete(){ delete docs[id]; grava(); },
        async update(p){ docs[id]={...(docs[id]||{}), ...p}; grava(); }
      }; }
    }; },
    doc(){ return { onSnapshot(cb){
      fetch("dados/salas-vip.json", {cache:"no-store"}).then(r => r.ok ? r.json() : null)
        .then(d => cb(d ? {exists:true, data:() => d} : {exists:false})).catch(() => cb({exists:false}));
      return () => {};
    } }; }
  };
})();

/* ---------- banco de dados ---------- */
(async () => {
  await null;
  let db=null;
  try{ db = window.claude?.use ? await window.claude.use("db") : null; }catch(e){ db=null; }
  if(!db){ db = LocalDB; ST.dbLocal = true; q("#vExp").hidden = false; q("#vImp").hidden = false; }
  ST.db=db;
  db.collection("viagens").onSnapshot(snap => {
    ST.viagens = snap.docs.map(d => ({id:d.id, ...d.data()}));
    LS.set("cacheViagens", ST.viagens); ST.sync="ok"; renderViagens(); if(ST.mod==="Vip") renderVip();
  }, e => { ST.sync="erro"; ST.syncErro=e?.code||""; renderViagens(); });
  db.doc("salasvip/base").onSnapshot(s => {
    if(!s.exists) return; const d=s.data();
    if(d?.aeroportos && (maisNova(d.meta?.versao, VIP0.meta.versao) || d.meta?.versao===VIP0.meta.versao)){ ST.vip=d; ST.vipFonte = ST.dbLocal ? "dados/salas-vip.json" : "banco do app"; if(ST.mod==="Vip") renderVip(); }
  }, ()=>{});
})();

/* ---------- viagens ---------- */
const proximas = () => ST.viagens.filter(v => !v.fim || dt(v.fim) >= hoje()).sort((a,b) => (a.inicio||"").localeCompare(b.inicio||""));
const passadas = () => ST.viagens.filter(v => v.fim && dt(v.fim) < hoje()).sort((a,b) => (b.inicio||"").localeCompare(a.inicio||""));
const aviaoSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12h20"/><path d="m15 5 7 7-7 7"/></svg>';

function syncTxt(){
  if(ST.sync==="ok") return ST.dbLocal ? `${ST.viagens.length} viagem(ns) · salvas neste aparelho (use Exportar/Importar para levar a outro)` : `${ST.viagens.length} viagem(ns) · sincronizado entre seus aparelhos`;
  if(ST.sync==="local") return "Só leitura: abra pelo app Claude, conectado, para editar e sincronizar";
  if(ST.sync==="erro") return "Não foi possível ler o banco agora" + (ST.syncErro?` (${ST.syncErro})`:"") + "; mostrando a última cópia";
  return "Carregando…";
}
function contagem(v){
  const i=dt(v.inicio), f=dt(v.fim)||i, t=hoje(); if(!i) return {n:"", l:""};
  if(t<i){ const n=dias(t,i); return {n, l: n===1?"dia para embarcar":"dias para embarcar"}; }
  if(t<=f) return {n: dias(i,t)+1, l:`º dia de ${dias(i,f)+1}`};
  return {n:"", l:"concluída"};
}
function cartaoEmbarque(v){
  const c=contagem(v), o=h(v.sigla_origem||""), d=h(v.sigla_destino||v.destino||"");
  const pend=(v.pendencias||[]).filter(p=>!p.ok).length;
  return `<button class="pass" data-v="${h(v.id)}" aria-label="Abrir ${h(v.titulo)}">
    <div class="main">
      <div class="rota">${o?`<span>${o}</span>${aviaoSvg}`:""}<span>${d}</span></div>
      <div class="dest">${h(v.titulo)}</div>
      <div class="datas">${fcurta(v.inicio)} a ${fcurta(v.fim)} ${(v.fim||v.inicio||"").slice(0,4)}${pend?` · ${pend} pendência(s)`:""}</div>
    </div>
    <div class="stub"><div class="n">${c.n}</div><div class="l">${h(c.l)}</div></div>
  </button>`;
}
function linhaViagem(v){
  return `<button class="trip" data-v="${h(v.id)}"><span class="dt">${fcurta(v.inicio)}</span><span><span class="t">${h(v.titulo)}</span><small>${h(v.destino||"")}</small></span></button>`;
}
function renderViagens(){
  q("#vSync").textContent = syncTxt();
  q("#vNova").disabled = !ST.db;
  const M=q("#vMain");
  if(ST.editando){ M.innerHTML = formulario(ST.editando==="nova"?null:ST.viagens.find(v=>v.id===ST.editando)); return; }
  if(ST.aberta){ const v=ST.viagens.find(x=>x.id===ST.aberta); if(v){ M.innerHTML = detalhe(v); return; } ST.aberta=null; }
  const P=proximas(), A=passadas();
  if(!ST.viagens.length){ M.innerHTML = `<div class="vazio"><p>Nenhuma viagem cadastrada ainda.</p>${ST.db?'<button class="btn pri" data-acao-v="nova" type="button">Cadastrar a primeira viagem</button>':""}</div>`; return; }
  M.innerHTML = `
   ${P.length?`<section class="nv-sec">${cartaoEmbarque(P[0])}</section>`:""}
   ${P.length>1?`<section class="nv-sec"><h3>Depois</h3><div class="nv-list">${P.slice(1).map(linhaViagem).join("")}</div></section>`:""}
   ${A.length?`<section class="nv-sec"><h3>Já fizemos</h3><div class="nv-list">${A.map(linhaViagem).join("")}</div></section>`:""}`;
}
function blocoVip(v){
  const cods=(v.aeroportos||[]).map(x=>String(x).toUpperCase());
  if(!cods.length) return "";
  const partes = cods.map(c => {
    const ap = ST.vip.aeroportos.find(a=>a.iata===c);
    if(!ap) return `<p class="nv-note">${h(c)}: sem salas na base.</p>`;
    const boas = ap.salas.filter(s => Object.values(s.acesso_cartoes||{}).some(x=>x.status!=="nao"));
    return `<div class="sala"><div class="nv-row"><h3>${h(c)} · ${h(ap.cidade)}</h3><span class="nv-sp"></span><button class="btn sm" type="button" data-vip="${h(c)}">Ver salas</button></div>
      ${boas.length? boas.map(s=>`<div class="meta"><b>${h(s.nome)}</b> (${setorTxt(s.setor)}) — ${badgesCurtos(s)}</div>`).join("") : '<p class="nv-note">Nenhuma sala grátis ou na cota com seus cartões.</p>'}</div>`;
  }).join("");
  return `<section class="nv-sec"><h3>Salas VIP no trajeto</h3>${partes}</section>`;
}
function detalhe(v){
  const kv=[["Quando",`${fdata(v.inicio)} a ${fdata(v.fim)}`],["Destino",v.destino],["Transporte",v.transporte],["Quem vai",v.viajantes],["Hospedagem",v.hospedagem],["Reserva",v.reserva]].filter(x=>x[1]);
  const voos=v.voos||[], rot=v.roteiro||[], pend=v.pendencias||[];
  return `<div class="det">
   <div class="nv-row" style="margin-top:12px"><button class="btn sm" type="button" data-acao-v="voltar">Voltar</button><span class="nv-sp"></span>
     ${ST.db?`<button class="btn sm" type="button" data-acao-v="editar">Editar</button><button class="btn sm" type="button" data-acao-v="excluir">${ST.excluir===v.id?"Confirmar exclusão":"Excluir"}</button>`:""}</div>
   <section class="nv-sec">${cartaoEmbarque(v)}</section>
   <section class="nv-sec card"><dl class="kv">${kv.map(([k,x])=>`<dt>${h(k)}</dt><dd>${h(x)}</dd>`).join("")}</dl></section>
   ${voos.length?`<section class="nv-sec"><h3>Voos</h3><div class="tbl"><table><thead><tr><th>Voo</th><th>Trecho</th><th>Saída</th><th>Chegada</th></tr></thead><tbody>${voos.map(x=>`<tr><td>${h(x.voo)}</td><td>${h(x.trecho)}</td><td>${h(x.saida)}</td><td>${h(x.chegada)}</td></tr>`).join("")}</tbody></table></div></section>`:""}
   ${blocoVip(v)}
   ${pend.length?`<section class="nv-sec"><h3>Pendências</h3>${pend.map((p,i)=>`<label class="pend ${p.ok?"ok":""}"><input type="checkbox" data-pend="${i}" ${p.ok?"checked":""} ${ST.db?"":"disabled"}><span>${h(p.txt)}</span></label>`).join("")}</section>`:""}
   ${rot.length?`<section class="nv-sec"><h3>Roteiro</h3>${rot.map(r=>`<div class="dia"><b>${h(r.dia)}</b><span>${h(r.texto)}</span></div>`).join("")}</section>`:""}
   ${v.notas?`<section class="nv-sec"><h3>Notas</h3><div class="card" style="white-space:pre-wrap">${h(v.notas)}</div></section>`:""}
  </div>`;
}
const linhas = s => String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
function formulario(v){
  v = v || {};
  const voos=(v.voos||[]).map(x=>[x.voo,x.trecho,x.saida,x.chegada].join(" | ")).join("\n");
  const rot=(v.roteiro||[]).map(r=>`${r.dia} | ${r.texto}`).join("\n");
  const pend=(v.pendencias||[]).map(p=>(p.ok?"[x] ":"")+p.txt).join("\n");
  const f=(id,rot,val,extra="")=>`<label for="${id}">${rot}</label><input id="${id}" value="${h(val||"")}" ${extra}>`;
  const t=(id,rot,val,dica)=>`<label for="${id}">${rot} <small>${dica||""}</small></label><textarea id="${id}">${h(val||"")}</textarea>`;
  return `<form class="form-v" id="vForm">
   <h2 style="margin-top:14px">${v.id?"Editar viagem":"Nova viagem"}</h2>
   ${f("fTitulo","Nome da viagem",v.titulo,'required maxlength="90"')}
   ${f("fDestino","Destino",v.destino,'maxlength="120"')}
   <div class="duo"><div>${f("fIni","Ida",v.inicio,'type="date" required')}</div><div>${f("fFim","Volta",v.fim,'type="date"')}</div></div>
   <div class="duo"><div>${f("fOri","Sigla de saída",v.sigla_origem,'maxlength="5" placeholder="FOR"')}</div><div>${f("fDst","Sigla do destino",v.sigla_destino,'maxlength="5" placeholder="MIA"')}</div></div>
   ${f("fAer","Aeroportos para salas VIP",(v.aeroportos||[]).join(", "),'placeholder="FOR, GRU"')}
   ${f("fTrans","Transporte",v.transporte)}
   ${f("fQuem","Quem vai",v.viajantes)}
   ${f("fHosp","Hospedagem",v.hospedagem)}
   ${f("fRes","Reserva / localizador",v.reserva)}
   ${t("fVoos","Voos",voos,"um por linha: voo | trecho | saída | chegada")}
   ${t("fRot","Roteiro",rot,"um por linha: dia | programa")}
   ${t("fPend","Pendências",pend,"uma por linha; [x] no início marca como feita")}
   ${t("fNotas","Notas",v.notas,"")}
   <div class="nv-row" style="margin:16px 0 8px"><button class="btn pri" type="submit">Salvar viagem</button><button class="btn" type="button" data-acao-v="cancelar">Cancelar</button></div>
  </form>`;
}
async function salvar(){
  if(!ST.db){ aviso("Sem conexão com o banco: não dá para salvar agora"); return; }
  const g=id=>q("#"+id).value.trim();
  if(!g("fTitulo")||!g("fIni")){ aviso("Preencha o nome e a data de ida"); return; }
  if(g("fFim") && g("fFim")<g("fIni")){ aviso("A volta está antes da ida"); return; }
  const dados = {
    titulo:g("fTitulo"), destino:g("fDestino"), inicio:g("fIni"), fim:g("fFim")||g("fIni"),
    sigla_origem:g("fOri").toUpperCase(), sigla_destino:g("fDst").toUpperCase(),
    aeroportos:g("fAer").toUpperCase().split(/[\s,;]+/).filter(Boolean),
    transporte:g("fTrans"), viajantes:g("fQuem"), hospedagem:g("fHosp"), reserva:g("fRes"),
    voos:linhas(q("#fVoos").value).map(l=>{const p=l.split("|").map(x=>x.trim()); return {voo:p[0]||"",trecho:p[1]||"",saida:p[2]||"",chegada:p[3]||""};}),
    roteiro:linhas(q("#fRot").value).map(l=>{const i=l.indexOf("|"); return i<0?{dia:"",texto:l}:{dia:l.slice(0,i).trim(),texto:l.slice(i+1).trim()};}),
    pendencias:linhas(q("#fPend").value).map(l=>/^\[x\]\s*/i.test(l)?{txt:l.replace(/^\[x\]\s*/i,""),ok:true}:{txt:l,ok:false}),
    notas:q("#fNotas").value.trim(), atualizado:new Date().toISOString()
  };
  const id = ST.editando!=="nova" ? ST.editando : (nz(dados.titulo).replace(/ /g,"-").slice(0,40)+"-"+Date.now().toString(36));
  try{ await ST.db.collection("viagens").doc(id).set(dados); ST.editando=null; ST.aberta=id; aviso("Viagem salva"); renderViagens(); window.scrollTo({top:0}); }
  catch(e){ aviso("Não salvou: "+(e?.code||"erro")+". Tente de novo."); }
}
q("#vMain").addEventListener("submit", e => { if(e.target.id==="vForm"){ e.preventDefault(); salvar(); } });
q("#vNova").addEventListener("click", () => { ST.editando="nova"; ST.aberta=null; renderViagens(); window.scrollTo({top:0}); });
q("#vMain").addEventListener("click", async e => {
  const vip=e.target.closest("[data-vip]"); if(vip){ ST.busca=vip.dataset.vip; q("#vipQ").value=ST.busca; modulo("Vip"); return; }
  const b=e.target.closest("[data-v]"); if(b){ ST.aberta=b.dataset.v; ST.excluir=null; renderViagens(); window.scrollTo({top:0}); return; }
  const a=e.target.closest("[data-acao-v]"); if(!a) return;
  const ac=a.dataset.acaoV;
  if(ac==="voltar"){ ST.aberta=null; ST.excluir=null; renderViagens(); }
  else if(ac==="nova"){ ST.editando="nova"; renderViagens(); }
  else if(ac==="editar"){ ST.editando=ST.aberta; renderViagens(); window.scrollTo({top:0}); }
  else if(ac==="cancelar"){ ST.editando=null; renderViagens(); }
  else if(ac==="excluir"){
    if(ST.excluir!==ST.aberta){ ST.excluir=ST.aberta; renderViagens(); setTimeout(()=>{ if(ST.excluir){ ST.excluir=null; renderViagens(); } },5000); return; }
    try{ await ST.db.collection("viagens").doc(ST.aberta).delete(); ST.aberta=null; ST.excluir=null; aviso("Viagem excluída"); renderViagens(); }
    catch(err){ aviso("Não excluiu: "+(err?.code||"erro")); }
  }
});
q("#vMain").addEventListener("change", async e => {
  const c=e.target.closest("input[data-pend]"); if(!c||!ST.db) return;
  const v=ST.viagens.find(x=>x.id===ST.aberta); if(!v) return;
  const pend=(v.pendencias||[]).map((p,i)=> i===+c.dataset.pend ? {...p, ok:c.checked} : p);
  try{ await ST.db.collection("viagens").doc(v.id).update({pendencias:pend}); }
  catch(err){ c.checked=!c.checked; aviso("Não salvou a marcação"); }
});


q("#vExp").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({app:"nossas-viagens", exportado:new Date().toISOString(), viagens:LocalDB.todos()}, null, 2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "nossas-viagens-" + new Date().toISOString().slice(0,10) + ".json"; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); aviso("Arquivo exportado");
});
q("#vImp").addEventListener("click", () => q("#vImpF").click());
/* importação tolerante: aceita o formato deste app e o de versões anteriores (lista, mapa, chaves em inglês etc.) */
const IMP = (() => {
  const low = o => Object.fromEntries(Object.entries(o||{}).map(([k,v]) => [nz(k).replace(/ /g,"_"), v]));
  const pega = (o, ...ks) => { for(const k of ks){ const v=o[k]; if(v!==undefined && v!==null && v!=="") return v; } return undefined; };
  const data = v => {
    if(v==null || v==="") return "";
    if(typeof v==="number") v = new Date(v).toISOString();
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
    if(m){ const y = m[3].length===2 ? "20"+m[3] : m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
    const d = new Date(s); return isNaN(d) ? "" : d.toISOString().slice(0,10);
  };
  const txt = v => v==null ? "" : Array.isArray(v) ? v.map(x => typeof x==="object" ? Object.values(x).filter(Boolean).join(" · ") : x).join("\n") : typeof v==="object" ? Object.entries(v).map(([k,x]) => `${k}: ${typeof x==="object"?JSON.stringify(x):x}`).join("\n") : String(v);
  const lista = v => v==null || v==="" ? [] : Array.isArray(v) ? v : typeof v==="object" ? Object.entries(v).map(([k,x]) => (typeof x==="object" && x) ? {dia:k, ...x} : {dia:k, texto:x}) : String(v).split(/\n+/).filter(Boolean);
  const pend = v => lista(v).map(p => typeof p==="string" ? {txt:p.replace(/^\[x\]\s*/i,""), ok:/^\[x\]/i.test(p)} : {txt: String(pega(low(p),"txt","texto","text","titulo","title","descricao","item","nome") ?? txt(p)), ok: !!pega(low(p),"ok","feito","done","concluido","checked")});
  const rot = v => lista(v).map(r => typeof r==="string" ? (r.includes("|") ? {dia:r.split("|")[0].trim(), texto:r.split("|").slice(1).join("|").trim()} : {dia:"", texto:r}) : (o => ({dia: String(pega(o,"dia","data","day","date") ?? ""), texto: String(pega(o,"texto","programa","descricao","atividades","text","plano","title","titulo") ?? txt(o))}))(low(r)));
  const voo = v => lista(v).map(x => typeof x==="string" ? (p => ({voo:p[0]||"", trecho:p[1]||"", saida:p[2]||"", chegada:p[3]||""}))(x.split("|").map(s=>s.trim())) : (o => ({voo:String(pega(o,"voo","numero","flight","codigo")??""), trecho:String(pega(o,"trecho","rota","route","de_para")??[pega(o,"origem","from"),pega(o,"destino","to")].filter(Boolean).join(" → ")), saida:String(pega(o,"saida","partida","departure","hora_saida")??""), chegada:String(pega(o,"chegada","arrival","hora_chegada")??"")}))(low(x)));
  const CONHECIDOS = new Set(["id","titulo","title","nome","name","viagem","destino","destination","local","cidade","inicio","data_inicio","datainicio","ida","start","start_date","startdate","de","partida","fim","data_fim","datafim","volta","end","end_date","enddate","ate","retorno","sigla_origem","origem","from","sigla_destino","aeroportos","airports","transporte","transport","viajantes","pessoas","travelers","participantes","hospedagem","hotel","hospedagens","lodging","reserva","reservas","booking","localizador","voos","flights","roteiro","itinerario","dias","itinerary","pendencias","tarefas","todo","todos","checklist","notas","observacoes","obs","notes","atualizado","updated","updated_at"]);
  function viagem(raw, idx){
    const o = low(raw);
    const titulo = String(pega(o,"titulo","title","nome","name","viagem") ?? pega(o,"destino","destination","cidade","local") ?? `Viagem ${idx+1}`);
    const extras = Object.entries(raw).filter(([k]) => !CONHECIDOS.has(nz(k).replace(/ /g,"_")));
    const notas = [txt(pega(o,"notas","observacoes","obs","notes")), extras.length ? "Campos do app anterior:\n" + extras.map(([k,v]) => `${k}: ${typeof v==="object"?JSON.stringify(v):v}`).join("\n") : ""].filter(Boolean).join("\n\n");
    const aer = pega(o,"aeroportos","airports");
    const v = {
      titulo, destino: txt(pega(o,"destino","destination","cidade","local") ?? ""),
      inicio: data(pega(o,"inicio","data_inicio","datainicio","ida","start","start_date","startdate","de","partida")),
      fim: data(pega(o,"fim","data_fim","datafim","volta","end","end_date","enddate","ate","retorno")),
      sigla_origem: String(pega(o,"sigla_origem","origem","from") ?? "").slice(0,5).toUpperCase(),
      sigla_destino: String(pega(o,"sigla_destino") ?? "").slice(0,5).toUpperCase(),
      aeroportos: Array.isArray(aer) ? aer.map(String) : String(aer||"").toUpperCase().split(/[\s,;]+/).filter(Boolean),
      transporte: txt(pega(o,"transporte","transport")), viajantes: txt(pega(o,"viajantes","pessoas","travelers","participantes")),
      hospedagem: txt(pega(o,"hospedagem","hotel","hospedagens","lodging")), reserva: txt(pega(o,"reserva","reservas","booking","localizador")),
      voos: voo(pega(o,"voos","flights")), roteiro: rot(pega(o,"roteiro","itinerario","dias","itinerary")),
      pendencias: pend(pega(o,"pendencias","tarefas","todo","todos","checklist")), notas,
      atualizado: new Date().toISOString()
    };
    const id = String(pega(o,"id") ?? (nz(titulo).replace(/ /g,"-").slice(0,40) + "-" + (v.inicio || idx)));
    return [id, v];
  }
  const pareceViagem = x => x && typeof x==="object" && !Array.isArray(x) && Object.keys(low(x)).some(k => ["titulo","title","nome","name","destino","destination","inicio","start","data_inicio","ida","roteiro","voos"].includes(k));
  function acha(d, prof=0){       // procura a lista de viagens em qualquer nível do arquivo
    if(prof>4 || d==null) return null;
    if(typeof d==="string" && /^\s*[\[{]/.test(d)){ try{ return acha(JSON.parse(d), prof+1); }catch(e){ return null; } }   // dumps de localStorage guardam JSON como texto
    if(Array.isArray(d)) return d.filter(pareceViagem).length ? d.filter(pareceViagem) : null;
    if(typeof d!=="object") return null;
    for(const k of ["viagens","trips","travels","items","dados","data"]) if(d[k]!=null){ const r=acha(d[k],prof+1); if(r) return r; }
    const vals = Object.values(d); if(vals.length && vals.every(pareceViagem)) return Object.entries(d).map(([id,v]) => ({id, ...v}));
    for(const v of vals){ const r=acha(v,prof+1); if(r) return r; }
    return null;
  }
  function lerTexto(t){
    t = t.replace(/^\uFEFF/,"").trim();
    try{ return JSON.parse(t); }catch(e){}
    const a = Math.min(...["{","["].map(c => t.indexOf(c)).filter(i => i>=0)), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
    if(isFinite(a) && b>a) return JSON.parse(t.slice(a, b+1));   // JSON dentro de texto
    throw new Error("nao-json");
  }
  return { ler(texto){
    const d = lerTexto(texto); const lst = acha(d);
    if(!lst || !lst.length){ const ch = d && typeof d==="object" ? Object.keys(d).slice(0,8).join(", ") : typeof d; const e=new Error("sem-viagens"); e.chaves=ch; throw e; }
    return Object.fromEntries(lst.map(viagem));
  } };
})();
q("#vImpF").addEventListener("change", async e => {
  const f = e.target.files?.[0]; e.target.value = ""; if(!f) return;
  try{
    const novas = IMP.ler(await f.text()); const n = Object.keys(novas).length, atuais = LocalDB.todos();
    const repetidas = Object.keys(novas).filter(id => atuais[id]).length;
    if(!confirm(`Importar ${n} viagem(ns) de "${f.name}"?` + (repetidas ? `\n${repetidas} já existe(m) aqui e será(ão) atualizada(s).` : "") + "\nAs demais viagens deste aparelho são mantidas.")) return;
    LocalDB.substitui({...atuais, ...novas}); aviso(`${n} viagem(ns) importada(s)`);
  }catch(err){
    if(err.message==="nao-json") aviso("Não consegui ler o arquivo: ele não está em formato JSON");
    else if(err.message==="sem-viagens") aviso(`Não achei viagens no arquivo (chaves encontradas: ${err.chaves||"nenhuma"})`);
    else aviso("Erro ao importar: " + (err.message||"desconhecido"));
  }
});

/* ---------- salas VIP ---------- */
const ROT={ilimitado:"Grátis",condicional:"Grátis com gasto mínimo",cota:"Usa a cota",pago:"Pago",nao:"Sem acesso"};
const ORD={ilimitado:5,condicional:4,cota:3,pago:2,nao:0};
const COR={ilimitado:"var(--ok)",condicional:"var(--plum)",cota:"var(--oud)",pago:"var(--muted)",nao:"var(--line)"};
const CART={c6_carbon:"C6",inter_prime:"Inter"};
const setorTxt = s => ({domestico:"embarque doméstico",internacional:"embarque internacional",publica:"antes do raio-x",desembarque:"desembarque"}[s]||s);
const CURTO={PP:"Priority Pass",LK:"LoungeKey",DP:"DragonPass",DP_VISA:"Visa Airport Companion",WP:"W Premium",INTER:"Inter Lounge",C6:"Espaço C6",MCB:"Mastercard Black",AMEX:"Amex",BRADESCO:"Bradesco",CIA:"Companhia aérea",AVULSO:"Avulso"};
const progNome = c => CURTO[c] || ST.vip.programas?.[c]?.nome || c;
function badgesCurtos(s){
  return Object.entries(s.acesso_cartoes||{}).filter(([,x])=>x.status!=="nao").map(([c,x])=>`${CART[c]||c}: ${ROT[x.status].toLowerCase()}`).join("; ");
}
function cartoesAtivos(){ return ST.cartao==="c6_carbon"||ST.cartao==="inter_prime" ? [ST.cartao] : ["c6_carbon","inter_prime"]; }
function melhor(s){ return cartoesAtivos().map(c=>s.acesso_cartoes?.[c]?.status||"nao").sort((a,b)=>ORD[b]-ORD[a])[0]; }
function salaPassa(s){
  if(ST.setor && s.setor!==ST.setor) return false;
  if(ST.cartao!=="todos" && melhor(s)==="nao") return false;
  return true;
}
function apsFiltrados(){
  const qn=nz(ST.busca);
  return ST.vip.aeroportos.map(ap => {
    const apTxt=nz([ap.iata,ap.cidade,ap.uf,ap.nome].join(" "));
    const casaAp = !qn || apTxt.includes(qn) || nz(ap.iata)===qn;
    const salas = ap.salas.filter(s => salaPassa(s) && (casaAp || nz(s.nome).includes(qn)));
    return {ap, salas};
  }).filter(x=>x.salas.length);
}
function meusAeroportos(){ return [...new Set(proximas().flatMap(v=>(v.aeroportos||[]).map(x=>String(x).toUpperCase())))]; }
function renderMapa(lista){
  const W=BR.W, H=BR.H, meus=meusAeroportos();
  const pins=lista.map(({ap,salas})=>{
    const x=(ap.mapa.lng-BR.lo0)*BR.s, y=(BR.la1-ap.mapa.lat)*BR.s;
    const st=salas.map(melhor).sort((a,b)=>ORD[b]-ORD[a])[0];
    const sel = nz(ST.busca)===nz(ap.iata);
    return `<g class="pin ${sel?"sel":""}" data-ap="${h(ap.iata)}" role="button" tabindex="0" aria-label="${h(ap.iata)} ${h(ap.cidade)}, ${salas.length} sala(s)">
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${sel?7:5.5}" fill="${COR[st]}"></circle></g>`;
  }).join("");
  const rots=lista.map(({ap})=>{ const x=(ap.mapa.lng-BR.lo0)*BR.s, y=(BR.la1-ap.mapa.lat)*BR.s, sel=nz(ST.busca)===nz(ap.iata);
    return (sel || meus.includes(ap.iata) || ["GRU","GIG","BSB","FOR","REC","SSA","POA","CNF","MAO","BEL"].includes(ap.iata)) ? `<text class="rot" x="${(x+8).toFixed(1)}" y="${(y+3).toFixed(1)}">${h(ap.iata)}</text>` : ""; }).join("");
  q("#vipMapa").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa do Brasil com os aeroportos que têm salas VIP"><path class="pais" d="${BR.d}"></path>${pins}<g aria-hidden="true">${rots}</g></svg>
   <div class="leg"><span><i style="background:${COR.ilimitado}"></i>Grátis</span><span><i style="background:${COR.condicional}"></i>Com gasto mínimo</span><span><i style="background:${COR.cota}"></i>Na cota</span><span><i style="background:${COR.pago}"></i>Pago</span><span><i style="background:${COR.nao};border:1px solid var(--muted)"></i>Sem acesso</span></div>`;
}
function salaCard(s){
  const acc = Object.entries(s.acesso_cartoes||{}).map(([c,x])=>`<span class="st ${x.status}">${CART[c]||c}: ${ROT[x.status]}${x.via?` (${h(progNome(x.via))})`:""}</span>`).join("");
  const meta=[s.terminal?`Terminal ${s.terminal.replace(/^T/,"")}`:"", setorTxt(s.setor), s.horario?`Horário: ${s.horario}`:"", s.avulso?`Avulso: ${s.avulso}`:""].filter(Boolean).map(h).join(" · ");
  return `<article class="sala"><h3>${h(s.nome)}</h3>
    <div class="onde ${s.local_verificado?"":"nv"}">${h(s.local)}</div>
    <div class="meta">${meta}</div>
    <div class="acc">${acc}</div>
    <div class="acc">${(s.acessos||[]).map(c=>`<span class="prog">${h(progNome(c))}</span>`).join("")}</div>
    ${s.obs?`<div class="obs">${h(s.obs)}</div>`:""}</article>`;
}
function renderVip(){
  const m=ST.vip.meta||{};
  q("#vipBase").textContent = `Base v${m.versao||"?"} de ${fcurta(m.atualizado_em)||"?"} ${m.atualizado_em?.slice(0,4)||""} · ${ST.vipFonte}`;
  document.querySelectorAll("#vipCartao button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.c===ST.cartao?"true":"false"));
  document.querySelectorAll("#vipSetor button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.s===ST.setor?"true":"false"));
  const meus=meusAeroportos();
  q("#vipMeus").innerHTML = meus.length ? meus.map(c=>`<button type="button" data-meu="${h(c)}" aria-pressed="${nz(ST.busca)===nz(c)}">${h(c)} · próxima viagem</button>`).join("") : "";
  q("#vipMeus").hidden = !meus.length;
  let lista=apsFiltrados();
  lista.sort((a,b)=> (meus.includes(b.ap.iata)-meus.includes(a.ap.iata)) || a.ap.cidade.localeCompare(b.ap.cidade));
  renderMapa(lista);
  const nS=lista.reduce((t,x)=>t+x.salas.length,0);
  q("#vipRes").innerHTML = !lista.length ? `<div class="vazio"><p>Nenhuma sala com esses filtros.</p><button class="btn" type="button" id="vipZera">Mostrar todas</button></div>` :
   `<p class="nv-note" style="margin-top:12px">${nS} sala(s) em ${lista.length} aeroporto(s).</p>` +
   lista.map(({ap,salas})=>`<section class="ap"><div class="ap-h"><span class="iata">${h(ap.iata)}</span><span class="cid">${h(ap.cidade)} · ${h(ap.uf)}</span><span class="nm">${h(ap.nome)}</span></div>
     <div class="links"><a class="btn sm" href="${h(ap.mapa.google_maps)}" target="_blank" rel="noopener noreferrer">Abrir no Google Maps ↗</a>${Object.entries(ap.mapa.planta_oficial||{}).map(([t,u])=>`<a class="btn sm" href="${h(u)}" target="_blank" rel="noopener noreferrer">Planta ${h(t)} ↗</a>`).join("")}</div>
     ${ap.obs?`<p class="nv-note">${h(ap.obs)}</p>`:""}${salas.map(salaCard).join("")}</section>`).join("");
  const C=ST.vip.cartoes||{};
  q("#vipRegras").innerHTML = `<summary>Regras dos cartões</summary>` + Object.values(C).map(c=>`<div class="card" style="margin-top:8px"><h3>${h(c.nome)}</h3>
     ${Object.entries(c.regras).filter(([,r])=>r.status!=="nao").map(([k,r])=>`<div class="r"><b>${h(progNome(k))}</b> · <span class="st ${r.status}">${ROT[r.status]}</span><div>${h(r.detalhe)}</div>${r.como?`<div class="nv-note">${h(r.como)}</div>`:""}</div>`).join("")}
     ${c.variante_1mi?`<p class="nv-note">${h(c.variante_1mi)}</p>`:""}</div>`).join("") + `<div class="nv-aviso" style="margin-top:8px">${(ST.vip.meta?.avisos||[]).map(h).join("<br>")}</div>`;
}
q("#vipForm").addEventListener("submit", e => { e.preventDefault(); q("#vipQ").blur(); });
q("#vipQ").addEventListener("input", e => { ST.busca=e.target.value; renderVip(); });
q("#vipLimpa").addEventListener("click", () => { ST.busca=""; q("#vipQ").value=""; renderVip(); });
q("#vipCartao").addEventListener("click", e => { const b=e.target.closest("button[data-c]"); if(!b) return; ST.cartao=b.dataset.c; LS.set("vipCartao",ST.cartao); renderVip(); });
q("#vipSetor").addEventListener("click", e => { const b=e.target.closest("button[data-s]"); if(!b) return; ST.setor=b.dataset.s; renderVip(); });
q("#vipMeus").addEventListener("click", e => { const b=e.target.closest("button[data-meu]"); if(!b) return; ST.busca = nz(ST.busca)===nz(b.dataset.meu) ? "" : b.dataset.meu; q("#vipQ").value=ST.busca; renderVip(); });
q("#vipRes").addEventListener("click", e => { if(e.target.id==="vipZera"){ ST.busca=""; ST.setor=""; ST.cartao="todos"; q("#vipQ").value=""; renderVip(); } });
const escolhePin = el => { const c=el.dataset.ap; ST.busca = nz(ST.busca)===nz(c) ? "" : c; q("#vipQ").value=ST.busca; renderVip(); if(ST.busca) q("#vipRes").scrollIntoView({behavior:"smooth",block:"start"}); };
q("#vipMapa").addEventListener("click", e => { const g=e.target.closest(".pin"); if(g) escolhePin(g); });
q("#vipMapa").addEventListener("keydown", e => { const g=e.target.closest(".pin"); if(g && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); escolhePin(g); } });

/* ---------- início ---------- */
renderViagens();
modulo(["Viagens","Vip","Perf"].includes(ST.mod) ? ST.mod : "Viagens");
})();

</script>
